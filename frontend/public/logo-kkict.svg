<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="ตราสัญลักษณ์ศูนย์พัฒนาทักษะและการเรียนรู้ ICT ขอนแก่น">
  <defs>
    <linearGradient id="kkict-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e8199"/>
      <stop offset="55%" stop-color="#0b5d74"/>
      <stop offset="100%" stop-color="#062c38"/>
    </linearGradient>
    <linearGradient id="kkict-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#kkict-bg)" stroke="url(#kkict-gold)" stroke-width="5"/>
  <!-- Circuit / digital nodes -->
  <circle cx="30" cy="30" r="4" fill="#fde047"/>
  <circle cx="90" cy="30" r="4" fill="#38bdf8"/>
  <path d="M34 30 H50 L56 36 M86 30 H70 L64 36" stroke="#fde047" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- Bold ICT lettering -->
  <text x="60" y="70" text-anchor="middle" font-family="'IBM Plex Sans Thai', 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="#ffffff">ICT</text>
  <!-- Bottom KKICT pill -->
  <rect x="24" y="80" width="72" height="18" rx="9" fill="url(#kkict-gold)"/>
  <text x="60" y="93" text-anchor="middle" font-family="'IBM Plex Sans Thai', 'Segoe UI', sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#062c38">KKICT</text>
</svg>
